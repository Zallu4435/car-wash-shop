<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Bike Frame -->
  <path d="M60 60 L100 40 L120 60 L100 80 Z" fill="#EF4444" stroke="#DC2626" stroke-width="2"/>
  
  <!-- Seat -->
  <ellipse cx="90" cy="50" rx="15" ry="8" fill="#1F2937"/>
  
  <!-- Handlebars -->
  <line x1="100" y1="40" x2="110" y2="35" stroke="#374151" stroke-width="3"/>
  <line x1="110" y1="35" x2="105" y2="32" stroke="#374151" stroke-width="2"/>
  <line x1="110" y1="35" x2="115" y2="32" stroke="#374151" stroke-width="2"/>
  
  <!-- Wheels -->
  <circle cx="50" cy="90" r="20" fill="#1F2937" stroke="#374151" stroke-width="2"/>
  <circle cx="50" cy="90" r="12" fill="#6B7280"/>
  <circle cx="50" cy="90" r="4" fill="#1F2937"/>
  
  <circle cx="150" cy="90" r="20" fill="#1F2937" stroke="#374151" stroke-width="2"/>
  <circle cx="150" cy="90" r="12" fill="#6B7280"/>
  <circle cx="150" cy="90" r="4" fill="#1F2937"/>
  
  <!-- Connecting Frame -->
  <line x1="60" y1="60" x2="50" y2="90" stroke="#DC2626" stroke-width="3"/>
  <line x1="120" y1="60" x2="150" y2="90" stroke="#DC2626" stroke-width="3"/>
  <line x1="60" y1="60" x2="150" y2="90" stroke="#DC2626" stroke-width="2"/>
  
  <!-- Headlight -->
  <circle cx="110" cy="35" r="3" fill="#FCD34D"/>
</svg>
