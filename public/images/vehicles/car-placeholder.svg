<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Car Body -->
  <rect x="20" y="50" width="160" height="50" rx="8" fill="#3B82F6"/>
  <rect x="40" y="40" width="120" height="30" rx="6" fill="#60A5FA"/>
  
  <!-- Windows -->
  <rect x="50" y="45" width="35" height="20" rx="3" fill="#E0F2FE"/>
  <rect x="115" y="45" width="35" height="20" rx="3" fill="#E0F2FE"/>
  
  <!-- Wheels -->
  <circle cx="50" cy="100" r="15" fill="#1F2937"/>
  <circle cx="50" cy="100" r="8" fill="#6B7280"/>
  <circle cx="150" cy="100" r="15" fill="#1F2937"/>
  <circle cx="150" cy="100" r="8" fill="#6B7280"/>
  
  <!-- Headlights -->
  <rect x="170" y="60" width="8" height="12" rx="2" fill="#FCD34D"/>
  
  <!-- Details -->
  <line x1="100" y1="45" x2="100" y2="65" stroke="#3B82F6" stroke-width="2"/>
</svg>
